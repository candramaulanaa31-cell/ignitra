# IGNITRA's only onchain code: a stateless custom condition for Zodiac Roles v2.
# Reproducible: no CBOR metadata, so anyone compiling this source gets the same bytecode and
# therefore the same CREATE2 address (packages/actions/src/onchain/bounds.ts embeds it).
[profile.default]
src = "src"
out = "out"
libs = []
solc_version = "0.8.21"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
