# Stages a new @ignitra/sdk version on npm when a tag like sdk-v0.2.0 is pushed (or by hand).
#
# No npm token is stored in GitHub: the job signs in through npm trusted publishing (OIDC). Staging
# defers the 2FA step: the version is uploaded but not public until a maintainer approves it,
#   npm stage list @ignitra/sdk
#   npm stage approve <stage-id>        # asks for 2FA, then publishes
#
# One-time setup on npmjs.com (package @ignitra/sdk → Settings → Trusted publishing): add GitHub
# Actions with this repository and the workflow file name release-sdk.yml, and allow staged
# publishing for it.
name: Stage the SDK on npm

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test the SDK
        run: pnpm --filter @ignitra/sdk run typecheck && pnpm --filter @ignitra/sdk run test

      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          test "sdk-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      # pnpm packs it: publishConfig swaps in the dist entry points (npm would ship the source ones).
      - name: Pack
        run: pnpm --filter @ignitra/sdk exec pnpm pack --pack-destination "$RUNNER_TEMP"

      # Staging and trusted publishing need a recent npm CLI.
      - name: Stage
        run: |
          npm install --global npm@11
          npm stage publish "$RUNNER_TEMP"/ignitra-sdk-*.tgz --access public
